# YAML schema for an Israeli bilingual resume template.

resume_metadata:
  type: object
  required: [template, default_language, supported_languages, rtl_languages]
  properties:
    template: {type: string, enum: [israeli_resume]}
    default_language: {type: string, enum: [he, en]}
    supported_languages:
      type: array
      items: {type: string, enum: [he, en]}
    rtl_languages:
      type: array
      items: {type: string, enum: [he]}

personal_information:
  type: object
  required: [first_name, last_name, email, phone, city, country]
  properties:
    first_name: {type: string}
    last_name: {type: string}
    email: {type: string, format: email}
    phone:
      type: string
      description: Israeli phone number, for example +972-50-123-4567 or 050-123-4567.
    city: {type: string}
    country: {type: string, enum: [Israel]}
    github: {type: string, format: uri}
    portfolio: {type: string, format: uri}
    linkedin:
      type: string
      format: uri
      required: false

versions:
  type: object
  required: [he, en]
  properties:
    he:
      type: object
      required: [direction, headline, summary, skills, education_details, experience_details, projects, languages]
      properties:
        direction: {type: string, enum: [rtl]}
        headline: {type: string}
        summary: {type: string}
        skills: {type: array, items: {type: string}}
        education_details: {type: array, items: {type: object}}
        experience_details: {type: array, items: {type: object}}
        projects: {type: array, items: {type: object}}
        languages: {type: array, items: {type: object}}
    en:
      type: object
      required: [direction, headline, summary, skills, education_details, experience_details, projects, languages]
      properties:
        direction: {type: string, enum: [ltr]}
        headline: {type: string}
        summary: {type: string}
        skills: {type: array, items: {type: string}}
        education_details: {type: array, items: {type: object}}
        experience_details: {type: array, items: {type: object}}
        projects: {type: array, items: {type: object}}
        languages: {type: array, items: {type: object}}
